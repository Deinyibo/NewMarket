<body>
<div id="app"><p style="padding:20px">Loading NewMart…</p></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient('https://uibnynbfsqtcqztcfydo.supabase.co','sb_publishable_FrhpbJJH_4r7M3IVfyBfEA_WVoK44UX');
const NGN=n=>'₦'+Math.round(n).toLocaleString('en-NG'),$=i=>document.getElementById(i),FEE=1500;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Fashion & Tailoring','Groceries & Foodstuff','Electronics & Gadgets','Home & Living'];
const LBL={paid:'Paid (in escrow)',preparing:'Preparing',shipped:'Shipped',delivered:'Delivered',released:'Released to seller',cash_collected:'Cash collected',refunded:'Refunded'};
const FLOW={online:['paid','preparing','shipped','delivered','released'],pod:['preparing','shipped','delivered','cash_collected']};
let S={stores:[],products:[],orders:[],disputes:[],invoices:[],me:null,rules:{rate:.05,cap:50000},buyers:0,cart:JSON.parse(localStorage.getItem('nmcart')||'[]')},view='shop',q='',cat='All',tab='overview',sid=null,payM='online',authTab='in',busy=false;
const store=i=>S.stores.find(s=>s.id===i),prod=i=>S.products.find(p=>p.id===i),me=()=>S.me,myStore=()=>S.me&&S.me.storeId?store(S.me.storeId):null;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)}
const saveCart=()=>localStorage.setItem('nmcart',JSON.stringify(S.cart));
function phone(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);if(!d.startsWith('234'))d='234'+d;return'+'+d}
async function load(){
 const {data:{session}}=await db.auth.getSession(),g=async t=>(await db.from(t).select('*')).data||[];
 const [st,pr,set]=await Promise.all([g('stores'),g('products'),g('settings')]);let fin=[],ord=[],dis=[],inv=[],p=null;S.buyers=0;
 if(session){p=(await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle()).data;
  if(p&&p.role==='buyer'&&localStorage.getItem('nmPending')){const x=JSON.parse(localStorage.getItem('nmPending'));localStorage.removeItem('nmPending');const r=await db.rpc('create_store',x);if(r.error)toast(r.error.message);else return load()}
  [fin,ord,dis,inv]=await Promise.all([g('store_finance'),g('orders'),g('disputes'),g('invoices')]);
  if(p&&p.role==='admin')S.buyers=(await db.from('profiles').select('id',{count:'exact',head:true}).eq('role','buyer')).count||0}
 S.me=p?{id:p.id,name:p.name,phone:p.phone||'',role:p.role,storeId:p.store_id,done:p.successful_orders}:null;
 if(set[0])S.rules={rate:+set[0].commission_rate,cap:+set[0].pod_cap};
 S.stores=st.map(s=>{const f=fin.find(x=>x.store_id===s.id)||{};return{id:s.id,name:s.name,category:s.category,loc:s.location,icon:s.icon,status:s.status,wallet:+f.wallet||0,held:+f.held||0,owed:+f.owed||0,sales:+f.sales||0}});
 S.products=pr.map(x=>({id:x.id,storeId:x.store_id,name:x.name,price:+x.price,stock:x.stock,icon:x.icon,category:x.category}));
 S.disputes=dis.map(d=>({id:d.id,orderId:d.order_id,storeId:d.store_id,reason:d.reason,status:d.status}));
 S.invoices=inv.map(i=>({id:i.id,storeId:i.store_id,amount:+i.amount,due:i.due,status:i.status}));
 S.orders=ord.map(o=>({id:o.id,storeId:o.store_id,items:o.items,total:+o.total,pay:o.payment,status:o.status,addr:o.address,phone:o.phone,at:o.created_at,rating:o.rating})).sort((a,b)=>b.at.localeCompare(a.at))}
async function refresh(){await load();render()}
async function rpc(fn,args,msg){const r=await db.rpc(fn,args);if(r.error){toast(r.error.message);return false}if(msg)toast(msg);await refresh();return true}
async function run(p,msg){const r=await p;if(r.error){toast(r.error.message);return false}if(msg)toast(msg);await refresh();return true}
const V={};
const IMG={'Fashion & Tailoring':'store-fashion.jpg','Groceries & Foodstuff':'store-groceries.jpg','Electronics & Gadgets':'store-electronics.jpg'};
const CI={'Fashion & Tailoring':'👗','Groceries & Foodstuff':'🧺','Electronics & Gadgets':'🎧','Home & Living':'🏠'},TI=c=>'t'+Math.max(0,CATS.indexOf(c));
function render(){const u=me(),n=S.cart.reduce((a,i)=>a+i.qty,0),nav=[['shop','Home'],['stores','Stores']];if(u&&u.role==='buyer')nav.push(['orders','My orders']);if(u&&u.storeId)nav.push(['dash','Dashboard']);if(u&&u.role==='admin')nav.push(['admin','Admin']);if(!u)nav.push(['sell','Sell on NewMart']);
 const mob=[['shop','🏠','Home'],['stores','🏪','Stores'],['cart','🛒','Cart'],u&&u.role==='admin'?['admin','⚙️','Admin']:u&&u.role==='buyer'?['orders','📦','Orders']:u&&u.storeId?['dash','📊','Dashboard']:['sell','🏬','Sell']];
 $('app').innerHTML=`<div class="ann">🔒 Escrow-protected payments · 🚚 Pay on delivery · 📍 Port Harcourt pilot sellers</div><header><div class="w hd"><button class="logo" onclick="go('shop')" aria-label="NewMart home"><svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="14" fill="#12296b"/><path d="M25 75L25 25L45 25L65 55L65 25L75 25L75 75L55 75L35 45L35 75Z" fill="#fff"/><rect x="25" y="78" width="50" height="6" rx="3" fill="#d21f2b"/></svg><span>New<b>Mart</b></span></button><nav class="dn">${nav.map(([k,l])=>`<button class="nl ${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><div class="hr"><button class="ib" onclick="go('cart')" aria-label="Cart">🛒${n?`<i class="bg">${n}</i>`:''}</button>${u?`<button class="b s" onclick="logout()">Log out</button>`:`<button class="b s n" onclick="authTab='in';go('auth')">Log in</button>`}</div></div></header>${V[view]()}${foot()}<nav class="mn">${mob.map(([k,i,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}${k==='cart'&&n?`<i class="bg">${n}</i>`:''}</button>`).join('')}</nav>`}
function foot(){return`<footer class="ft"><div class="w fg"><div><div class="fl">NewMart</div><p class="mu" style="color:#9fb0e6">Every store in Port Harcourt, one cart. Escrow-protected payments or pay on delivery.</p></div><div><h4>Shop</h4><button onclick="go('shop')">Home</button><button onclick="go('stores')">Stores</button><button onclick="go('cart')">Cart</button></div><div><h4>Sell</h4><button onclick="go('sell')">Open a store</button><button onclick="go('dash')">Seller dashboard</button></div><div><h4>Trust</h4><button onclick="go('shop');setTimeout(()=>$('how').scrollIntoView(),60)">How escrow works</button></div></div><div class="w fb"><span>Built by New Technologies — Innovation &amp; Excellence</span><span>© 2026 NewMart</span></div></footer>`}
function go(v,x){view=v;if(x!==undefined)sid=x;window.scrollTo(0,0);render()}
function prodCard(p){const s=store(p.storeId)||{name:''},out=p.stock<=0,low=p.stock>0&&p.stock<=5,im=IMG[p.category],h=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);return`<article class="pc"><div class="pt ${TI(p.category)}" ${im?`style="background-image:url(${im});background-size:260%;background-position:${15+h%71}% ${15+(h>>3)%71}%"`:''}><span class="em">${esc(p.icon)}</span>${out?'<span class="tag">Sold out</span>':low?`<span class="tag">Only ${p.stock} left</span>`:''}</div><div class="pb"><div class="ps">${esc(s.name)}</div><h3>${esc(p.name)}</h3><div class="pp"><span class="pr">${NGN(p.price)}</span><button class="add" ${out?'disabled':''} onclick="addCart('${p.id}')" aria-label="Add ${esc(p.name)} to cart">+</button></div></div></article>`}
function list(){const t=q.toLowerCase();return S.products.filter(p=>{const s=store(p.storeId);return s&&s.status==='active'&&(cat==='All'||p.category===cat)&&(!t||(p.name+s.name+p.category).toLowerCase().includes(t))})}
function grid(){const l=list();return l.length?l.map(prodCard).join(''):'<p class="mu">No products yet. Check back soon, or try another search.</p>'}
V.shop=()=>{const cnt=c=>S.products.filter(p=>p.category===c&&(store(p.storeId)||{}).status==='active').length,go2="$('picks').scrollIntoView({behavior:'smooth'})";
return`<section class="hh"><div class="w hg"><div><span class="pill">📍 Port Harcourt marketplace</span><h1>Every store in Port Harcourt, <em>one cart.</em></h1><p>Shop fashion, groceries and gadgets from local businesses. Pay online and your money stays in escrow until you confirm delivery, or pay cash on delivery.</p><div class="sb"><input type="search" placeholder="Search products, stores, categories" value="${esc(q)}" oninput="q=this.value;$('grid').innerHTML=grid()" aria-label="Search"><button onclick="${go2}">Search</button></div><div class="row"><button class="b p lg" onclick="${go2}">Start shopping</button><button class="b gh lg" onclick="go('sell')">Sell on NewMart</button></div></div><div class="hv2"><img src="home-hero.jpg" alt="Ankara fabric, fresh tomatoes and peppers, a smartphone and earbuds" width="760" height="490"><div class="fb1">🔒 Escrow protected</div><div class="fb2">🚚 Pay on delivery</div></div></div></section>
<section class="tr"><div class="w tg"><div class="ti"><span>🔒</span><div><b>Escrow protection</b><small>Paid only when you confirm</small></div></div><div class="ti"><span>🚚</span><div><b>Pay on delivery</b><small>Cash when it arrives</small></div></div><div class="ti"><span>🏪</span><div><b>Local sellers</b><small>Real Port Harcourt stores</small></div></div><div class="ti"><span>🛟</span><div><b>Dispute help</b><small>Refund or release, fairly</small></div></div></div></section>
<section class="sec"><div class="w"><div class="sh"><h2>Shop by category</h2></div><div class="g4">${CATS.map((c,i)=>`<button class="ctile" style="background-image:${IMG[c]?`linear-gradient(180deg,transparent 35%,rgba(8,15,45,.85)),url(${IMG[c]})`:'linear-gradient(135deg,#d21f2b,#12296b)'}" onclick="cat=CATS[${i}];render();${go2}"><b>${esc(c)}</b><small>${cnt(c)} items</small></button>`).join('')}</div></div></section>
<section class="sec alt"><div class="w"><div class="sh"><h2>Featured stores</h2><button class="lk" onclick="go('stores')">See all →</button></div><div class="g2">${S.stores.filter(s=>s.status==='active').slice(0,3).map(storeCard).join('')||'<p class="mu">Stores will appear here soon.</p>'}</div></div></section>
<section class="sec" id="picks"><div class="w"><div class="sh"><h2>Today’s picks</h2></div><div class="chips"><button class="b s ${cat==='All'?'on':''}" onclick="cat='All';render();${go2}">All</button>${CATS.map((c,i)=>`<button class="b s ${cat===c?'on':''}" onclick="cat=CATS[${i}];render();${go2}">${esc(c)}</button>`).join('')}</div><div class="g" id="grid">${grid()}</div></div></section>
<section class="sec" id="how"><div class="w"><h2 class="ct">Shop with confidence</h2><div class="g3"><div class="stp"><i>1</i><h3>Choose and pay</h3><p class="mu">Pay online by card, transfer or USSD, or choose pay on delivery.</p></div><div class="stp"><i>2</i><h3>We hold your money</h3><p class="mu">Online payments stay in escrow while the store prepares and ships your order.</p></div><div class="stp"><i>3</i><h3>Confirm and release</h3><p class="mu">Tap Confirm delivery and the seller is paid. Problem? Open a dispute.</p></div></div></div></section>
<section class="cta"><div class="w"><h2>Run your whole shop from one dashboard</h2><p>Open a NewMart store free. Add products, track orders and withdraw earnings. You pay only when you sell.</p><button class="b lg wh" onclick="go('sell')">Open your store</button></div></section>`};
function storeCard(s){const n=S.products.filter(p=>p.storeId===s.id).length;return`<article class="scd"><div class="si ${IMG[s.category]?'ph2':''}" ${IMG[s.category]?`style="background-image:url(${IMG[s.category]})"`:''}>${IMG[s.category]?'':esc(s.icon)}</div><div><h3 style="margin:0">${esc(s.name)}</h3><div class="mu">📍 ${esc(s.loc)}</div><div class="mu">${rt(s)} · ${n} products</div></div><button class="b n s" onclick="go('store','${s.id}')">Visit</button></article>`}
V.stores=()=>`<div class="ph"><div class="w"><h1>Stores</h1><p>Verified local businesses in Port Harcourt.</p></div></div><div class="w sec"><div class="g2">${S.stores.filter(s=>s.status==='active').map(storeCard).join('')||'<p class="mu">No stores yet.</p>'}</div></div>`;
function rt(s){const r=S.orders.filter(o=>o.storeId===s.id&&o.rating);return r.length?'★ '+(r.reduce((a,o)=>a+o.rating,0)/r.length).toFixed(1):'New store'}
V.store=()=>{const s=store(sid);if(!s||s.status!=='active')return'<div class="w sec"><p>This store is unavailable.</p></div>';return`<div class="ph" ${IMG[s.category]?`style="background-image:linear-gradient(135deg,rgba(18,41,107,.9),rgba(10,23,68,.78)),url(${IMG[s.category]});background-size:cover;background-position:center"`:''}><div class="w row" style="gap:16px"><div class="si ${IMG[s.category]?'ph2':''}" style="width:72px;height:72px;font-size:2.4rem;${IMG[s.category]?`background-image:url(${IMG[s.category]})`:''}">${IMG[s.category]?'':esc(s.icon)}</div><div><h1>${esc(s.name)}</h1><p>📍 ${esc(s.loc)} · ${rt(s)}</p></div></div></div><div class="w sec"><div class="g">${S.products.filter(p=>p.storeId===s.id).map(prodCard).join('')||'<p class="mu">No products yet.</p>'}</div></div>`};
function addCart(id){const p=prod(id),c=S.cart;if(c.length&&prod(c[0].pid).storeId!==p.storeId){toast('One store per order. Clear your cart to switch stores.');return}const l=c.find(x=>x.pid===id);if(l){if(l.qty>=p.stock){toast('No more stock available.');return}l.qty++}else c.push({pid:id,qty:1});saveCart();toast(p.name+' added to cart');render()}
function qty(id,d){const l=S.cart.find(x=>x.pid===id);l.qty+=d;if(l.qty<1)S.cart=S.cart.filter(x=>x.pid!==id);else if(l.qty>prod(id).stock)l.qty=prod(id).stock;saveCart();render()}
V.cart=()=>{S.cart=S.cart.filter(l=>prod(l.pid));const c=S.cart,u=me();if(!c.length)return'<div class="w"><h1 style="margin-top:20px">Your cart</h1><p class="mu">Your cart is empty.</p><button class="b p" onclick="go(\'shop\')">Start shopping</button></div>';const sub=c.reduce((a,l)=>a+prod(l.pid).price*l.qty,0);
 return`<div class="w"><h1 style="margin-top:20px">Your cart</h1>${c.map(l=>{const p=prod(l.pid);return`<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--ln)"><div>${esc(p.icon)} <b>${esc(p.name)}</b><div class="mu">${NGN(p.price)}</div></div><div class="row"><button class="b s" onclick="qty('${p.id}',-1)" aria-label="Less">−</button><b>${l.qty}</b><button class="b s" onclick="qty('${p.id}',1)" aria-label="More">+</button></div></div>`}).join('')}<section class="pn"><div class="row sp"><span>Subtotal</span><b>${NGN(sub)}</b></div><div class="row sp"><span>Delivery</span><b>${NGN(FEE)}</b></div><div class="row sp"><h3>Total</h3><h3>${NGN(sub+FEE)}</h3></div></section>
 ${u&&u.role==='buyer'?`<section class="pn"><h2>Delivery</h2><label for="ph">Phone (+234)</label><input id="ph" type="tel" value="${esc(u.phone)}" placeholder="801 234 5678"><label for="ad">Delivery address</label><textarea id="ad" rows="2"></textarea><label>Payment</label><div class="row"><button class="b s ${payM==='online'?'on':''}" onclick="payM='online';render()">Pay online (escrow)</button><button class="b s ${payM==='pod'?'on':''}" onclick="payM='pod';render()">Pay on delivery</button></div><div class="note">${payM==='pod'?'Pay cash when your order arrives. New buyers can pay on delivery up to '+NGN(S.rules.cap)+'.':'Test mode: no real money moves yet. Your payment will be held in escrow until you confirm delivery.'}</div><button class="b p" style="width:100%" id="po" onclick="checkout()">Place order</button></section>`:u?'<div class="note">Store accounts cannot place orders. Use a buyer account.</div>':'<div class="note">Log in or sign up as a buyer to check out.</div><button class="b p" onclick="authTab=\'buyer\';go(\'auth\')">Sign up or log in</button>'}</div>`};
async function checkout(){const ph=$('ph').value.trim(),ad=$('ad').value.trim();if(ph.replace(/\D/g,'').length<10||!ad){toast('Add a valid phone and delivery address.');return}if(busy)return;busy=true;$('po').disabled=true;
 const ok=await rpc('place_order',{p_store:prod(S.cart[0].pid).storeId,p_items:S.cart.map(l=>({product_id:l.pid,qty:l.qty})),p_payment:payM,p_address:ad,p_phone:phone(ph)},payM==='online'?'Order placed. Payment held in escrow.':'Order placed. Pay cash on delivery.');busy=false;if(ok){S.cart=[];saveCart();go('orders')}else{const b=$('po');if(b)b.disabled=false}}
function steps(o){const f=FLOW[o.pay],i=f.indexOf(o.status);return`<div class="prog">${f.map((x,k)=>`<i class="${k<=i?'d':''}" title="${LBL[x]}"></i>`).join('')}</div>`}
function oCard(o,role){const s=store(o.storeId)||{name:''},ds=S.disputes.filter(x=>x.orderId===o.id),d=ds[ds.length-1],open=d&&d.status==='open';let act='';
 if(role==='buyer'){if(o.pay==='online'&&o.status==='delivered'&&!open)act+=`<button class="b n s" onclick="rpc('confirm_delivery',{p_order:'${o.id}'},'Delivery confirmed. Seller paid.')">Confirm delivery</button> `;
  if(o.pay==='online'&&['shipped','delivered'].includes(o.status)&&!open)act+=`<button class="b s" onclick="dispute('${o.id}')">Open dispute</button> `;
  if(['released','cash_collected'].includes(o.status)&&!o.rating)act+=`<select style="width:auto;min-height:38px" onchange="if(this.value)rpc('rate_order',{p_order:'${o.id}',p_rating:+this.value},'Thanks for rating.')"><option value="">Rate store</option>${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select>`}
 else{const f=FLOW[o.pay],nx=f[f.indexOf(o.status)+1],lim=o.pay==='online'?'delivered':'cash_collected';if(nx&&!open&&o.status!==lim&&o.status!=='refunded')act=`<button class="b n s" onclick="rpc('advance_order',{p_order:'${o.id}',p_status:'${nx}'})">Mark ${LBL[nx].toLowerCase()}</button>`}
 return`<section class="pn"><div class="row sp"><b>${role==='buyer'?esc(s.name):'Order '+o.id.slice(0,6)}</b><span class="bd2 ${['released','cash_collected'].includes(o.status)?'g1':o.status==='refunded'?'r1':''}">${LBL[o.status]}</span></div><div class="mu">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')} · ${NGN(o.total)} · ${o.pay==='online'?'Online (escrow)':'Pay on delivery'}</div><div class="mu">${esc(o.addr)} · ${esc(o.phone)}</div>${o.status==='refunded'?'':steps(o)}${d?`<div class="note">Dispute ${d.status==='open'?'open: awaiting review':'resolved: '+d.status}.</div>`:''}${o.rating?`<div class="mu">Rated ★ ${o.rating}</div>`:''}<div class="row">${act}</div></section>`}
V.orders=()=>{if(!me())return V.auth();return`<div class="w"><h1 style="margin-top:20px">My orders</h1>${S.orders.length?S.orders.map(o=>oCard(o,'buyer')).join(''):'<p class="mu">No orders yet.</p>'}</div>`};
function dispute(i){const r=prompt('What went wrong with this order?');if(r)rpc('open_dispute',{p_order:i,p_reason:r},'Dispute opened. We will review it.')}
V.auth=()=>{const st=authTab==='store',tt=authTab==='in'?'Welcome back':st?'Open your store':'Create your account';return`<div class="w"><div class="au"><div class="al"><h2>${st?'Sell to all of Port Harcourt':'Shop safely on NewMart'}</h2><ul>${(st?['Free to open: you pay only when you sell','Your own dashboard with owner, manager and sales roles','Escrow protects you and your buyers','Withdraw earnings to your bank']:['Your money is held in escrow until you confirm delivery','Pay online or cash on delivery','Track every order in one place','Dispute help if something goes wrong']).map(t=>`<li>${t}</li>`).join('')}</ul></div><div class="ar"><div class="tabs"><button class="${authTab==='in'?'on':''}" onclick="authTab='in';render()">Log in</button><button class="${authTab==='buyer'?'on':''}" onclick="authTab='buyer';render()">Buyer sign-up</button><button class="${st?'on':''}" onclick="authTab='store';render()">Sell</button></div><h2 style="margin:20px 0 0;font-size:1.4rem">${tt}</h2>${authTab!=='in'?`<label for="nm">${st?'Business name':'Full name'}</label><input id="nm">`:''}<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="6+ characters">${authTab!=='in'?`<label for="pn">Phone (+234)</label><input id="pn" type="tel" placeholder="801 234 5678">`:''}<button class="b p lg" style="width:100%;margin-top:18px" onclick="auth()">${authTab==='in'?'Log in':'Create account'}</button></div></div></div>`};
V.sell=()=>{authTab='store';return V.auth()};
async function auth(){const em=$('em').value.trim().toLowerCase(),pw=$('pw').value;if(!em||pw.length<6){toast('Enter your email and a password of 6+ characters.');return}
 if(authTab==='in'){const r=await db.auth.signInWithPassword({email:em,password:pw});if(r.error){toast(r.error.message);return}await load();const u=me();go(u&&u.role==='admin'?'admin':u&&u.storeId?'dash':S.cart.length?'cart':'shop');return}
 const nm=$('nm').value.trim(),ph=$('pn').value;if(!nm||ph.replace(/\D/g,'').length<10){toast('Add your name and a valid phone number.');return}
 if(authTab==='store')localStorage.setItem('nmPending',JSON.stringify({p_name:nm,p_category:CATS[0],p_location:'Port Harcourt, Nigeria',p_phone:phone(ph)}));
 const r=await db.auth.signUp({email:em,password:pw,options:{data:{name:nm,phone:phone(ph)}}});if(r.error){toast(r.error.message);return}
 if(!r.data.session){toast('Check your email to confirm your account, then log in.');authTab='in';render();return}
 await load();const u=me();toast('Welcome to NewMart');go(u&&u.storeId?'dash':S.cart.length?'cart':'shop')}
async function logout(){await db.auth.signOut();S.me=null;S.orders=[];S.disputes=[];S.invoices=[];go('shop');await refresh()}
const isOwner=u=>u.role==='owner',canProd=u=>['owner','manager'].includes(u.role);
V.dash=()=>{const u=me(),s=myStore();if(!u||!s)return V.auth();const open=S.orders.filter(o=>!['released','cash_collected','refunded'].includes(o.status)).length;
 const tabs=[['overview','Overview'],['orders','Orders'+(open?' ('+open+')':'')]];if(canProd(u))tabs.splice(1,0,['products','Products']);if(isOwner(u))tabs.push(['wallet','Wallet'],['settings','Store profile']);if(!tabs.some(t=>t[0]===tab))tab='overview';let body='';
 if(s.status==='suspended')body='<div class="note">This store is suspended by New Technologies.</div>';
 if(tab==='overview')body+=(isOwner(u)?`<div class="st"><div><span class="mu">Sales</span><b>${NGN(s.sales)}</b></div><div><span class="mu">Held in escrow</span><b>${NGN(s.held)}</b></div><div><span class="mu">Wallet</span><b>${NGN(s.wallet)}</b></div><div><span class="mu">Commission owed</span><b>${NGN(s.owed)}</b></div></div>`:'')+(S.products.some(p=>p.storeId===s.id)?'':'<div class="note"><b>Start here:</b> open Products and add your first product.</div>')+`<section class="pn"><h3>Needs attention</h3>${S.products.filter(p=>p.storeId===s.id&&p.stock<=5).map(p=>`<div class="low">${esc(p.name)}: ${p.stock?p.stock+' left':'out of stock'}</div>`).join('')||'<p class="mu">Stock levels look healthy.</p>'}<p class="mu">${open} open orders.</p></section>`;
 if(tab==='products')body+=`<section class="pn"><h3>Add product</h3><div class="r2"><div><label for="pn1">Name</label><input id="pn1"></div><div><label for="pp1">Price (₦)</label><input id="pp1" type="number" min="1" inputmode="numeric"></div><div><label for="ps1">Stock</label><input id="ps1" type="number" min="0" inputmode="numeric"></div><div><label for="pi1">Emoji icon</label><input id="pi1" value="📦" maxlength="4"></div></div><label for="pc1">Category</label><select id="pc1">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="b p" style="margin-top:12px" onclick="addProd()">Add product</button></section><section class="pn sc"><table class="tb"><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr>${S.products.filter(p=>p.storeId===s.id).map(p=>`<tr><td>${esc(p.icon)} ${esc(p.name)}</td><td>${NGN(p.price)}</td><td class="${p.stock<=5?'low':''}">${p.stock}</td><td><button class="b s" onclick="editPrice('${p.id}')">Price</button> <button class="b s" onclick="run(db.from('products').update({stock:${p.stock+10}}).eq('id','${p.id}'))">+10</button> <button class="b s" onclick="delProd('${p.id}')">Delete</button></td></tr>`).join('')}</table></section>`;
 if(tab==='orders')body+=S.orders.filter(o=>o.storeId===s.id).map(o=>oCard(o,'seller')).join('')||'<p class="mu">No orders yet.</p>';
 if(tab==='wallet')body+=`<div class="st"><div><span class="mu">Available</span><b>${NGN(s.wallet)}</b></div><div><span class="mu">In escrow</span><b>${NGN(s.held)}</b></div><div><span class="mu">Commission owed</span><b>${NGN(s.owed)}</b></div></div><section class="pn"><h3>Withdraw to bank</h3><label for="wa">Amount (₦)</label><input id="wa" type="number" inputmode="numeric" min="1000"><label for="wb">Account number and bank</label><input id="wb"><button class="b p" style="margin-top:12px" onclick="rpc('withdraw_funds',{p_amount:+$('wa').value,p_bank:$('wb').value},'Withdrawal requested')">Withdraw</button></section><section class="pn sc"><h3>Pay-on-delivery commission invoices</h3><table class="tb">${S.invoices.filter(i=>i.storeId===s.id).map(i=>`<tr><td>${NGN(i.amount)}</td><td>Due ${new Date(i.due).toLocaleDateString('en-NG')}</td><td>${i.status==='paid'?'Paid':`<button class="b s" onclick="rpc('pay_invoice',{p_invoice:'${i.id}'},'Invoice paid')">Pay now</button>`}</td></tr>`).join('')||'<tr><td class="mu">No invoices.</td></tr>'}</table></section>`;
 if(tab==='settings')body+=`<section class="pn"><h3>Store profile</h3><label for="sn">Store name</label><input id="sn" value="${esc(s.name)}"><label for="sc">Category</label><select id="sc">${CATS.map(c=>`<option ${c===s.category?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="sl">Location</label><input id="sl" value="${esc(s.loc)}"><label for="si">Emoji icon</label><input id="si" value="${esc(s.icon)}" maxlength="4"><button class="b p" style="margin-top:12px" onclick="saveStore()">Save store</button></section>`;
 return`<div class="w"><h1 style="margin-top:20px">${esc(s.name)}</h1><div class="mu">Signed in as ${esc(u.name)} · ${({owner:'Owner: full control',manager:'Manager: products and orders',sales:'Sales rep: orders only'})[u.role]}</div><div class="chips">${tabs.map(t=>`<button class="b s ${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${body}</div>`};
function addProd(){const n=$('pn1').value.trim(),p=+$('pp1').value,st=+$('ps1').value;if(!n||!(p>0)||!(st>=0)||$('ps1').value===''){toast('Add a name, a price above ₦0 and a stock count.');return}run(db.from('products').insert({store_id:me().storeId,name:n,price:Math.round(p),stock:Math.round(st),icon:$('pi1').value||'📦',category:$('pc1').value}),'Product added')}
function editPrice(i){const p=prod(i),v=+prompt('New price in ₦ for '+p.name,p.price);if(v>0)run(db.from('products').update({price:Math.round(v)}).eq('id',i),'Price updated')}
function delProd(i){if(confirm('Delete this product?'))run(db.from('products').delete().eq('id',i))}
function saveStore(){const n=$('sn').value.trim();if(!n){toast('Your store needs a name.');return}run(db.from('stores').update({name:n,category:$('sc').value,location:$('sl').value.trim(),icon:$('si').value}).eq('id',me().storeId),'Store profile saved')}
V.admin=()=>{const u=me();if(!u||u.role!=='admin')return'<div class="w"><h1 style="margin-top:20px">Admin only</h1><button class="b p" onclick="go(\'auth\')">Log in</button></div>';
 const gmv=S.orders.filter(o=>o.status!=='refunded').reduce((a,o)=>a+o.total,0),held=S.stores.reduce((a,s)=>a+s.held,0),sales=S.stores.reduce((a,s)=>a+s.sales,0);
 return`<div class="w"><h1 style="margin-top:20px">Platform overview</h1><div class="st"><div><span class="mu">GMV</span><b>${NGN(gmv)}</b></div><div><span class="mu">Commission (est.)</span><b>${NGN(sales*S.rules.rate)}</b></div><div><span class="mu">Held in escrow</span><b>${NGN(held)}</b></div><div><span class="mu">Open disputes</span><b>${S.disputes.filter(d=>d.status==='open').length}</b></div><div><span class="mu">Stores</span><b>${S.stores.length}</b></div><div><span class="mu">Buyers</span><b>${S.buyers}</b></div></div>
 <section class="pn"><h3>Platform rules</h3><div class="r2"><div><label for="ar">Commission (%)</label><input id="ar" type="number" step="0.5" min="0" max="30" value="${+(S.rules.rate*100).toFixed(1)}"></div><div><label for="ac">New-buyer pay-on-delivery cap (₦)</label><input id="ac" type="number" min="0" value="${S.rules.cap}"></div></div><button class="b p" style="margin-top:12px" onclick="saveRules()">Save rules</button></section>
 <section class="pn sc"><h3>Stores</h3><table class="tb"><tr><th>Store</th><th>Sales</th><th>Status</th><th></th></tr>${S.stores.map(s=>`<tr><td>${esc(s.name)}</td><td>${NGN(s.sales)}</td><td><span class="bd2 ${s.status==='active'?'g1':'r1'}">${s.status}</span></td><td><button class="b s" onclick="rpc('set_store_status',{p_store:'${s.id}',p_status:'${s.status==='active'?'suspended':'active'}'})">${s.status==='active'?'Suspend':'Reinstate'}</button></td></tr>`).join('')}</table></section>
 <section class="pn"><h3>Disputes</h3>${S.disputes.map(d=>{const o=S.orders.find(x=>x.id===d.orderId),s=store(d.storeId);return`<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><b>${esc(s?s.name:'')}</b> · ${o?NGN(o.total):''} · ${d.status}<div class="mu">${esc(d.reason)}</div>${d.status==='open'?`<div class="row" style="margin-top:6px"><button class="b s" onclick="rpc('resolve_dispute',{p_dispute:'${d.id}',p_decision:'refunded'},'Buyer refunded')">Refund buyer</button><button class="b n s" onclick="rpc('resolve_dispute',{p_dispute:'${d.id}',p_decision:'released'},'Released to seller')">Release to seller</button></div>`:''}</div>`}).join('')||'<p class="mu">No disputes.</p>'}</section></div>`};
function saveRules(){const r=+$('ar').value,c=+$('ac').value;if(!(r>=0&&r<=30)||!(c>=0)){toast('Commission must be 0–30% and the cap 0 or more.');return}run(db.from('settings').update({commission_rate:r/100,pod_cap:Math.round(c)}).eq('id',1),'Rules saved')}
db.auth.onAuthStateChange(()=>{});
refresh();
</script>
</body>
</html>
